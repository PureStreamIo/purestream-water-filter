<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureStream Pro Shop</title>
    <style>
        :root {
            --primary: #0071e3;
            --dark: #1d1d1f;
            --light: #f5f5f7;
            --white: #ffffff;
            --gray: #86868b;
            --border: #d2d2d7;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--white);
            color: var(--dark);
            padding-top: 80px;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
        }
        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
            text-decoration: none;
        }
        .cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .main-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 5%;
            text-align: center;
        }
        .main-content h1 {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }
        .main-content p {
            font-size: 1.25rem;
            color: var(--gray);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .price {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
        .buy-button {
            background: var(--primary);
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .product-box {
            width: 100%;
            max-width: 320px;
            height: 400px;
            background: linear-gradient(135deg, #ffffff, #e1f5fe);
            border: 2px solid var(--border);
            border-radius: 30px;
            margin: 3rem auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }
        .product-box span {
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: 1rem;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">PureStream.</a>
        <button class="cart-btn" onclick="alert('Your cart is empty!')">🛒 Cart (0)</button>
    </nav>

    <main class="main-content">
        <h1>Pure Water.<br>Zero Compromise.</h1>
        <p>The PureStream Pro countertop system utilizes zero-gravity multi-stage reverse osmosis to instantly remove 99.9% of microplastics, toxins, and heavy metals right from your kitchen faucet.</p>
        
        <div class="price">$149.00</div>
        
        <a href="https://stripe.com" class="buy-button">Buy Now</a>

        <div class="product-box">
            💧
            <span>PURESTREAM PRO v1</span>
        </div>
    </main>

</body>
</html>
