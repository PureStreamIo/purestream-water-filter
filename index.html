<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureStream Pro Shop</title>
    <style>
        :root {
            --primary: #0071e3;
            --dark: #1d1d1f;
            --light: #f5f5f7;
            --white: #ffffff;
            --gray: #86868b;
            --border: #d2d2d7;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: var(--white);
            color: var(--dark);
            padding-top: 90px;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
        }
        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
            text-decoration: none;
        }
        .cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
        }
        .hero-text h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .hero-text p {
            font-size: 1.2rem;
            color: var(--gray);
            margin-bottom: 2rem;
        }
        .price {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .buy-btn {
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        .product-img {
            width: 100%;
            max-width: 300px;
            height: 400px;
            background: #e1f5fe;
            border-radius: 20px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        @media (max-width: 768px) {
            .hero { grid-template-columns: 1fr; text-align: center; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">PureStream.</a>
        <button class="cart-btn">🛒 Cart (0)</button>
    </nav>

    <section class="hero">
        <div class="hero-text">
            <h1>Pure Water.<br>Zero Compromise.</h1>
            <p>The PureStream Pro removes 99.9% of microplastics, heavy metals, and toxins instantly right from your kitchen faucet.</p>
            <div class="price">$149.00</div>
            <button class="buy-btn" onclick="alert('Added to Cart!')">Add to Cart</button>
        </div>
        <div>
            <div class="product-img">💧</div>
        </div>
    </section>

</body>
</html>
